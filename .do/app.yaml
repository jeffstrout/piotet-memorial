# DigitalOcean App Platform spec for the Vincent Piotet Memorial.
#
# Fully static site. Page content is prerendered from client/src/data into
# dist/<route>/index.html. Photos, songs, and the download-all archive stay on
# the Spaces CDN (https://piotet-memorial.nyc3.cdn.digitaloceanspaces.com);
# those URLs are baked into the data files. There is no API service and no
# database.
#
# App Platform does NOT apply this file on git push. deploy_on_push only
# rebuilds components that are already in the *live* spec. After this change
# is on main, apply it explicitly:
#
#   doctl apps update 8b2eca84-318b-43ca-adc2-a5f701d5cb82 --spec .do/app.yaml
#
# Do that only after a pg_dump of the production database is archived. Applying
# this spec removes the api service and the managed Postgres database.
name: piotet-memorial
region: nyc

# www is the canonical host. The apex redirects to https://www (path preserved)
# so https://vincepiotet.com works — GoDaddy forwarding only covers http, and
# only to http://www. DNS for the apex must point at App Platform (A/ALIAS to
# the app ingress), not at GoDaddy's forwarder, or the redirect never runs.
domains:
  - domain: www.vincepiotet.com
    type: PRIMARY
  - domain: vincepiotet.com
    type: ALIAS

static_sites:
  - name: web
    github:
      repo: jeffstrout/piotet-memorial
      branch: main
      deploy_on_push: true
    source_dir: client
    build_command: npm install && npm run build
    output_dir: dist
    environment_slug: node-js
    index_document: index.html
    # Unknown paths serve the home page. Known routes are real files
    # (story/index.html, …) so a direct URL returns that page's HTML.
    catchall_document: index.html

ingress:
  rules:
    # Apex → https://www, keeping the original path (uri is omitted on purpose;
    # setting uri would replace the whole path).
    - match:
        authority:
          exact: vincepiotet.com
        path:
          prefix: /
      redirect:
        authority: www.vincepiotet.com
        scheme: https
        redirect_code: 301
    - match:
        path:
          prefix: /
      component:
        name: web
        preserve_path_prefix: true

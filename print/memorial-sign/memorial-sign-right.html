<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1a2f4d; --gold:#b99e56; --gold-accent:#a97e33; --rule-gold:#c2a25a;
    --caps:'Cinzel',serif; --serif:'Cormorant Garamond',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  @page{ size:11in 8.5in; margin:0; }
  html,body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  /* Full US-Letter sheet, landscape. Not folded. Background left unprinted so it
     can print on cream/parchment stock, matching the rest of the suite. */
  .sheet{
    width:11in; height:8.5in; position:relative; background:#fff;
    display:flex; flex-direction:column; align-items:center;
    padding:0.95in 0.8in 1.35in;
  }
  /* gold keyline frame */
  .sheet::before{
    content:""; position:absolute; inset:0.4in; border:1.6px solid var(--gold);
    pointer-events:none;
  }

  .star{ width:20px; height:20px; fill:var(--gold-accent); display:block; margin:0 auto; }

  .title{
    font-family:var(--caps); font-weight:600;
    font-size:132px; line-height:1;
    letter-spacing:0.08em; text-indent:0.08em;
    text-transform:uppercase; color:var(--ink-navy);
    margin:22px 0 0;
  }

  .rule{ display:flex; align-items:center; justify-content:center; gap:18px; width:58%; margin:26px auto 0; }
  .rule .l{ flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--rule-gold),transparent); }
  .rule .star{ width:13px; height:13px; }

  /* second line — location */
  .place{
    font-family:var(--caps); font-weight:600;
    font-size:40px; line-height:1.15; letter-spacing:0.06em; text-indent:0.06em;
    text-transform:uppercase; color:var(--ink-navy); margin-top:30px;
  }
  .place-note{
    font-family:var(--serif); font-style:italic; font-weight:500;
    font-size:30px; line-height:1.2; color:var(--ink-navy); margin-top:12px;
  }

  /* large directional arrow, dropped to the lower area */
  .arrow-big{ width:8in; height:auto; display:block; margin:auto auto 0; color:var(--ink-navy); }
  .arrow--left{ transform:scaleX(-1); }

  /* identity line at the foot of the sign */
  .credit{
    position:absolute; left:0; right:0; bottom:0.78in; text-align:center;
    font-family:var(--caps); font-weight:500;
    font-size:15px; letter-spacing:0.26em; text-indent:0.26em;
    text-transform:uppercase; color:var(--gold-accent);
  }
</style>
</head>
<body>
  <div class="sheet">
    <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5 14.9 8.6 21.5 9.5 16.7 14.2 17.9 20.8 12 17.7 6.1 20.8 7.3 14.2 2.5 9.5 9.1 8.6z"/></svg>
    <h1 class="title">Memorial</h1>
    <div class="rule"><span class="l"></span><svg class="star" viewBox="0 0 24 24"><path d="M12 2.5 14.9 8.6 21.5 9.5 16.7 14.2 17.9 20.8 12 17.7 6.1 20.8 7.3 14.2 2.5 9.5 9.1 8.6z"/></svg><span class="l"></span></div>
    <p class="place">3rd Floor &middot; Bethel Bible Church</p>
    <p class="place-note">above the Foundry Coffee House</p>
    <svg class="arrow-big" viewBox="0 0 420 60"><path d="M14 23 H362 L354 15 L412 30 L354 45 L362 37 H14 Z" fill="currentColor"/></svg>
    <p class="credit">Vincent Piotet &middot; Celebration of Life</p>
  </div>
</body>
</html>
